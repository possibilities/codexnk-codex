# Public GitHub Release for the codexnk patch.
# Tag `codexnk-vX.Y.Z` and push it. This does not use upstream's signed
# rust-v* release pipeline.

name: codexnk-release

on:
  push:
    tags:
      - "codexnk-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: codex-rs
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-ci

      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
        with:
          targets: ${{ matrix.target }}

      - uses: ./.github/actions/setup-rusty-v8
        with:
          target: ${{ matrix.target }}

      - name: Build codex
        shell: bash
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
          STABLE_GIT_COMMIT: ${{ github.sha }}
        run: cargo build --target "${{ matrix.target }}" --release --bin codex

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          name="codex-${{ matrix.target }}"
          mkdir -p "$name"
          cp "target/${{ matrix.target }}/release/codex" "$name/codex"
          tar -czf "${name}.tar.gz" "$name"

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: codex-${{ matrix.target }}
          path: codex-rs/codex-${{ matrix.target }}.tar.gz

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/codexnk-v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" dist/*.tar.gz \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --notes "Patched Codex binary. Archives contain a \`codex\` executable."
